apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-payment
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/miserybee99/devops-project.git
      targetRevision: feature/gitops
      path: k8s/charts/payment
      helm:
        valueFiles:
          - $values/overlays/dev/payment.yaml
    - repoURL: https://github.com/Phuc-215/yas-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy: {}
